        embed.defer = true;
        embed.crossOrigin = 'anonymous';
        embed.setAttribute('data-cfasync', true);

        // Add error handler to debug loading issues
        embed.onerror = function() {
          console.error('[VEE] Widget script failed to load from:', embed.src);
          console.error('[VEE] Please check:');
          console.error('[VEE] 1. Is your sitekey valid?');
          console.error('[VEE] 2. Is domain registered with VEE?');

        embed.onload = function() {
          console.log('[VEE] Widget script loaded successfully');

          // Wait for widget to initialize
          setTimeout(function() {
            var validationURL = window.args['access'] + '/lib/access.php?nocache&sitekey=' + window.args['sitekey'];

            // Check if widget initialized

        document.body.appendChild(embed);
      };

      // Ensure DOM is fully loaded before injecting script
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadScript);
      } else {
        loadScript();
      }
